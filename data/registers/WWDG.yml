block/WWDG:
  description: Window watchdog.
  items:
  - name: CR
    description: Control register.
    byte_offset: 0
    fieldset: CR
  - name: CFR
    description: Configuration register.
    byte_offset: 4
    fieldset: CFR
  - name: SR
    description: Status register.
    byte_offset: 8
    fieldset: SR
fieldset/CFR:
  description: Configuration register.
  fields:
  - name: W
    description: 7-bit window value.
    bit_offset: 0
    bit_size: 7
  - name: WDGTB
    description: Timer base.
    bit_offset: 7
    bit_size: 2
  - name: EWI
    description: Early wakeup interrupt.
    bit_offset: 9
    bit_size: 1
fieldset/CR:
  description: Control register.
  fields:
  - name: T
    description: 7-bit counter.
    bit_offset: 0
    bit_size: 7
  - name: WDGA
    description: Activation bit.
    bit_offset: 7
    bit_size: 1
fieldset/SR:
  description: Status register.
  fields:
  - name: EWIF
    description: Early wakeup interrupt flag.
    bit_offset: 0
    bit_size: 1
