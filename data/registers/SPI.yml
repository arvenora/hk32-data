block/SPI:
  description: Serial peripheral interface.
  items:
  - name: CR1
    description: control register 1.
    byte_offset: 0
    fieldset: CR1
  - name: CR2
    description: control register 2.
    byte_offset: 4
    fieldset: CR2
  - name: SR
    description: status register.
    byte_offset: 8
    fieldset: SR
  - name: DR
    description: data register.
    byte_offset: 12
    fieldset: DR
  - name: CRCPR
    description: CRC polynomial register.
    byte_offset: 16
    fieldset: CRCPR
  - name: RXCRCR
    description: RX CRC register.
    byte_offset: 20
    access: Read
    fieldset: RXCRCR
  - name: TXCRCR
    description: TX CRC register.
    byte_offset: 24
    access: Read
    fieldset: TXCRCR
  - name: I2SCFGR
    description: I2S configuration register.
    byte_offset: 28
    fieldset: I2SCFGR
  - name: I2SPR
    description: I2S prescaler register.
    byte_offset: 32
    fieldset: I2SPR
fieldset/CR1:
  description: control register 1.
  fields:
  - name: CPHA
    description: Clock phase.
    bit_offset: 0
    bit_size: 1
  - name: CPOL
    description: Clock polarity.
    bit_offset: 1
    bit_size: 1
  - name: MSTR
    description: Master selection.
    bit_offset: 2
    bit_size: 1
  - name: BR
    description: Baud rate control.
    bit_offset: 3
    bit_size: 3
  - name: SPE
    description: SPI enable.
    bit_offset: 6
    bit_size: 1
  - name: LSBFIRST
    description: Frame format.
    bit_offset: 7
    bit_size: 1
  - name: SSI
    description: Internal slave select.
    bit_offset: 8
    bit_size: 1
  - name: SSM
    description: Software slave management.
    bit_offset: 9
    bit_size: 1
  - name: RXONLY
    description: Receive only.
    bit_offset: 10
    bit_size: 1
  - name: CRCL
    description: CRC lenth.
    bit_offset: 11
    bit_size: 1
  - name: CRCNEXT
    description: CRC transfer next.
    bit_offset: 12
    bit_size: 1
  - name: CRCEN
    description: Hardware CRC calculation enable.
    bit_offset: 13
    bit_size: 1
  - name: BIDIOE
    description: Output enable in bidirectional mode.
    bit_offset: 14
    bit_size: 1
  - name: BIDIMODE
    description: Bidirectional data mode enable.
    bit_offset: 15
    bit_size: 1
fieldset/CR2:
  description: control register 2.
  fields:
  - name: SSOE
    description: SS output enable.
    bit_offset: 2
    bit_size: 1
  - name: NSSP
    description: NSS pulse management.
    bit_offset: 3
    bit_size: 1
  - name: FRF
    description: Frame format.
    bit_offset: 4
    bit_size: 1
  - name: ERRIE
    description: Error interrupt enable.
    bit_offset: 5
    bit_size: 1
  - name: RXNEIE
    description: RX buffer not empty interrupt enable.
    bit_offset: 6
    bit_size: 1
  - name: TXEIE
    description: Tx buffer empty interrupt enable.
    bit_offset: 7
    bit_size: 1
  - name: DS
    description: Data size.
    bit_offset: 8
    bit_size: 4
  - name: FRXTH
    description: FIFO reception threshold.
    bit_offset: 12
    bit_size: 1
fieldset/CRCPR:
  description: CRC polynomial register.
  fields:
  - name: CRCPOLY
    description: CRC polynomial register.
    bit_offset: 0
    bit_size: 16
fieldset/DR:
  description: data register.
  fields:
  - name: DR
    description: Data register.
    bit_offset: 0
    bit_size: 16
fieldset/I2SCFGR:
  description: I2S configuration register.
  fields:
  - name: CHLEN
    description: Channel length (number of bits per audio channel).
    bit_offset: 0
    bit_size: 1
  - name: DATLEN
    description: Data length to be transferred.
    bit_offset: 1
    bit_size: 2
  - name: CKPOL
    description: Steady state clock polarity.
    bit_offset: 3
    bit_size: 1
  - name: I2SSTD
    description: I2S standard selection.
    bit_offset: 4
    bit_size: 2
  - name: PCMSYNC
    description: PCM frame synchronization.
    bit_offset: 7
    bit_size: 1
  - name: I2SCFG
    description: I2S configuration mode.
    bit_offset: 8
    bit_size: 2
  - name: I2SE
    description: I2S Enable.
    bit_offset: 10
    bit_size: 1
  - name: I2SMOD
    description: I2S mode selection.
    bit_offset: 11
    bit_size: 1
fieldset/I2SPR:
  description: I2S prescaler register.
  fields:
  - name: I2SDIV
    description: I2S Linear prescaler.
    bit_offset: 0
    bit_size: 8
  - name: ODD
    description: Odd factor for the prescaler.
    bit_offset: 8
    bit_size: 1
  - name: MCKOE
    description: Master clock output enable.
    bit_offset: 9
    bit_size: 1
fieldset/RXCRCR:
  description: RX CRC register.
  fields:
  - name: RxCRC
    description: Rx CRC register.
    bit_offset: 0
    bit_size: 16
fieldset/SR:
  description: status register.
  fields:
  - name: RXNE
    description: Receive buffer not empty.
    bit_offset: 0
    bit_size: 1
  - name: TXE
    description: Transmit buffer empty.
    bit_offset: 1
    bit_size: 1
  - name: CHSIDE
    description: Channel side.
    bit_offset: 2
    bit_size: 1
  - name: UDR
    description: Underrun flag.
    bit_offset: 3
    bit_size: 1
  - name: CRCERR
    description: CRC error flag.
    bit_offset: 4
    bit_size: 1
  - name: MODF
    description: Mode fault.
    bit_offset: 5
    bit_size: 1
  - name: OVR
    description: Overrun flag.
    bit_offset: 6
    bit_size: 1
  - name: BSY
    description: Busy flag.
    bit_offset: 7
    bit_size: 1
  - name: FRE
    description: frame format error.
    bit_offset: 8
    bit_size: 1
  - name: FRLVL
    description: FIFO reception level.
    bit_offset: 9
    bit_size: 2
  - name: FTLVL
    description: FIFO transmission level.
    bit_offset: 11
    bit_size: 2
fieldset/TXCRCR:
  description: TX CRC register.
  fields:
  - name: TxCRC
    description: Tx CRC register.
    bit_offset: 0
    bit_size: 16
