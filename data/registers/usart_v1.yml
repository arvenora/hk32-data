    bit_offset: 21
    bit_size: 2
  - name: RTOEN
    description: Receiver timeout enable.
    bit_offset: 23
    bit_size: 1
  - name: ADD
    description: Address of the USART node.
    bit_offset: 24
    bit_size: 4
  - name: ADD4
    description: Address of the USART node.
    bit_offset: 28
    bit_size: 4
