block/USART:
  description: Universal synchronous asynchronous receiver transmitter.
  items:
  - name: CR1
    description: Control register 1.
    byte_offset: 0
    fieldset: CR1
  - name: CR2
    description: Control register 2.
    byte_offset: 4
    fieldset: CR2
  - name: CR3
    description: Control register 3.
    byte_offset: 8
    fieldset: CR3
  - name: BRR
    description: Baud rate register.
    byte_offset: 12
    fieldset: BRR
  - name: GTPR
    description: Guard time and prescaler register.
    byte_offset: 16
    fieldset: GTPR
  - name: RTOR
    description: Receiver timeout register.
    byte_offset: 20
    fieldset: RTOR
  - name: RQR
    description: Request register.
    byte_offset: 24
    fieldset: RQR
  - name: ISR
    description: Interrupt & status register.
    byte_offset: 28
    access: Read
    fieldset: ISR
  - name: ICR
    description: Interrupt flag clear register.
    byte_offset: 32
    fieldset: ICR
  - name: RDR
    description: Receive data register.
    byte_offset: 36
    access: Read
    fieldset: RDR
  - name: TDR
    description: Transmit data register.
    byte_offset: 40
    fieldset: TDR
fieldset/BRR:
  description: Baud rate register.
  fields:
  - name: BRR
    description: 'Baud rate register: include mantissa of USARTDIV(BRR[15:4]) and fraction of USARTDIV(BRR[3:0]).'
    bit_offset: 0
    bit_size: 16
fieldset/CR1:
  description: Control register 1.
  fields:
  - name: UE
    description: USART enable.
    bit_offset: 0
    bit_size: 1
  - name: UESM
    description: USART enable in Stop mode.
    bit_offset: 1
    bit_size: 1
  - name: RE
    description: Receiver enable.
    bit_offset: 2
    bit_size: 1
  - name: TE
    description: Transmitter enable.
    bit_offset: 3
    bit_size: 1
  - name: IDLEIE
    description: IDLE interrupt enable.
    bit_offset: 4
    bit_size: 1
  - name: RXNEIE
    description: RXNE interrupt enable.
    bit_offset: 5
    bit_size: 1
  - name: TCIE
    description: Transmission complete interrupt enable.
    bit_offset: 6
    bit_size: 1
  - name: TXEIE
    description: interrupt enable.
    bit_offset: 7
    bit_size: 1
  - name: PEIE
    description: PE interrupt enable.
    bit_offset: 8
    bit_size: 1
  - name: PS
    description: Parity selection.
    bit_offset: 9
    bit_size: 1
  - name: PCE
    description: Parity control enable.
    bit_offset: 10
    bit_size: 1
  - name: WAKE
    description: Receiver wakeup method.
    bit_offset: 11
    bit_size: 1
  - name: M
    description: Word length.
    bit_offset: 12
    bit_size: 1
  - name: MME
    description: Mute mode enable.
    bit_offset: 13
    bit_size: 1
  - name: CMIE
    description: Character match interrupt enable.
    bit_offset: 14
    bit_size: 1
  - name: OVER8
    description: Oversampling mode.
    bit_offset: 15
    bit_size: 1
  - name: DEDT
    description: Driver Enable deassertion time.
    bit_offset: 16
    bit_size: 5
  - name: DEAT
    description: Driver Enable assertion time.
    bit_offset: 21
    bit_size: 5
  - name: RTOIE
    description: Receiver timeout interrupt enable.
    bit_offset: 26
    bit_size: 1
  - name: EOBIE
    description: End of Block interrupt enable.
    bit_offset: 27
    bit_size: 1
  - name: M1
    description: Word length.
    bit_offset: 28
    bit_size: 1
fieldset/CR2:
